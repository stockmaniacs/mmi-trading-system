<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark rounded background -->
  <rect width="100" height="100" rx="22" fill="#0f172a"/>

  <!--
    Gauge geometry  (matches dashboard gauge.js)
    Center : cx=50, cy=65   Radius : 34
    Angle  : 180 + (mmi/100)*180  degrees

    Key arc endpoints:
      MMI  0 → 180° → (16.0, 65.0)
      MMI 20 → 216° → (22.5, 45.0)
      MMI 30 → 234° → (30.0, 37.5)
      MMI 50 → 270° → (50.0, 31.0)
      MMI 70 → 306° → (70.0, 37.5)
      MMI 80 → 324° → (77.5, 45.0)
      MMI100 → 360° → (84.0, 65.0)
  -->

  <!-- Background track -->
  <path d="M 16,65 A 34,34 0 0,1 84,65"
        fill="none" stroke="#1e293b" stroke-width="20" stroke-linecap="round"/>

  <!-- Zone segments — stroke-linecap:butt gives clean colour breaks -->

  <!-- High Extreme Fear  0–20  cyan -->
  <path d="M 16,65 A 34,34 0 0,1 22.5,45"
        fill="none" stroke="#06b6d4" stroke-width="18" stroke-linecap="butt"/>

  <!-- Extreme Fear       20–30  green -->
  <path d="M 22.5,45 A 34,34 0 0,1 30,37.5"
        fill="none" stroke="#22c55e" stroke-width="18" stroke-linecap="butt"/>

  <!-- Fear               30–50  lime -->
  <path d="M 30,37.5 A 34,34 0 0,1 50,31"
        fill="none" stroke="#84cc16" stroke-width="18" stroke-linecap="butt"/>

  <!-- Greed              50–70  amber -->
  <path d="M 50,31 A 34,34 0 0,1 70,37.5"
        fill="none" stroke="#f59e0b" stroke-width="18" stroke-linecap="butt"/>

  <!-- Extreme Greed      70–80  orange -->
  <path d="M 70,37.5 A 34,34 0 0,1 77.5,45"
        fill="none" stroke="#f97316" stroke-width="18" stroke-linecap="butt"/>

  <!-- High Extreme Greed 80–100 red -->
  <path d="M 77.5,45 A 34,34 0 0,1 84,65"
        fill="none" stroke="#dc2626" stroke-width="18" stroke-linecap="butt"/>

  <!-- Rounded caps on the very outer ends (covers the butt edge there) -->
  <circle cx="16" cy="65" r="9" fill="#06b6d4"/>
  <circle cx="84" cy="65" r="9" fill="#dc2626"/>

  <!-- Needle pointing to ~80 (High Extreme Greed zone) at angle 324° -->
  <line x1="50" y1="65" x2="77.5" y2="45"
        stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Hub -->
  <circle cx="50" cy="65" r="6" fill="white"/>
</svg>
