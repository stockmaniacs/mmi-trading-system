name = "mmi-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"

[triggers]
crons = ["30 10 * * 1-5"]
# 10:30 UTC = 4:00 PM IST on weekdays
# Worker checks market open status before proceeding

[[kv_namespaces]]
binding = "MMI_KV"
id = "16eb5d4a3b424f4eae486f50cd84aa76"
preview_id = "a2bc7c3a579f40388f3d05034beb0a5a"

[vars]
GITHUB_REPO        = "stockmaniacs/mmi-trading-system"
GITHUB_DATA_BRANCH = "main"
SMTP_HOST          = "smtp.hostinger.com"
SMTP_PORT          = "465"
SMTP_USER          = "alerts@stockmaniacs.net"

# Secrets — set via `wrangler secret put`:
#   GITHUB_TOKEN        (set)
#   TRIGGER_TOKEN       (set)
#   SMTP_PASSWORD       ← one remaining secret
